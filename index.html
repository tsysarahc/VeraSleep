    <script>
        let audioCtx = null;
        let noiseNode = null;
        let melodyInterval = null;
        let gainNode = null;
        let isSoundPlaying = true;
        let isDimMode = false;
        let currentVaultCategory = 'all'; 
        let breathInterval = null;
        let showBreathTimer = true;
        let currentIntroImage = "Clear_sky.jpg";

        function initLocalWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        fetchWeatherByCoords(position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        fetchWeatherByCoords(22.3193, 114.1694);
                    },
                    { timeout: 10000 }
                );
            } else {
                fetchWeatherByCoords(22.3193, 114.1694);
            }
        }

        function getWeatherImage(weatherCode) {
            if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(weatherCode)) {
                return weatherCode >= 63 ? "heavy_rain.jpg" : "rainy.jpg";
            } else if ([95, 96, 99].includes(weatherCode)) {
                return "lightning.jpg";
            } else if ([71, 73, 75, 77, 85, 86].includes(weatherCode)) {
                return "snow.jpg";
            } else if ([1, 2, 3].includes(weatherCode)) {
                return "cloudy_day.jpg";
            }
            return "Clear_sky.jpg";
        }

        async function fetchWeatherByCoords(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`);
                const data = await response.json();
                
                if(data && data.current) {
                    const temp = Math.round(data.current.temperature_2m);
                    const wCode = data.current.weather_code;
                    currentIntroImage = getWeatherImage(wCode);

                    const btn = document.getElementById('weather-btn');
                    if(btn) btn.innerText = `📍 ${temp}°C`;

                    if (!appState.unlockedImages.includes(currentIntroImage)) {
                        appState.unlockedImages.push(currentIntroImage);
                        saveState();
                    }
                }
            } catch(e) {
                const btn = document.getElementById('weather-btn');
                if(btn) btn.innerText = `📍 --`;
            }

            const introImgEl = document.getElementById('intro-img-element');
            if(introImgEl) {
                introImgEl.src = `images/${currentIntroImage}`;
            }
        }

        initLocalWeather();

        function initAudio() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) {}
        }

        function playSoundscape() {
            initAudio();
            stopSoundscape();
            if (!isSoundPlaying || !audioCtx) return;

            try {
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * 0.4;
                }

                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = noiseBuffer;
                noiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 320;
                filter.Q.value = 1.0;

                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);

                noiseNode.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                noiseNode.start();

                const pianoNotes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23];
                melodyInterval = setInterval(() => {
                    if (!isSoundPlaying || !audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    
                    const osc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    
                    const randomFreq = pianoNotes[Math.floor(Math.random() * pianoNotes.length)];
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(randomFreq, audioCtx.currentTime);

                    noteGain.gain.setValueAtTime(0, audioCtx.currentTime);
                    noteGain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 1.0);
                    noteGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);

                    osc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 5.0);
                }, 3800);
            } catch(e) {}
        }

        function stopSoundscape() {
            if (noiseNode) {
                try { noiseNode.stop(); noiseNode.disconnect(); } catch(e) {}
                noiseNode = null;
            }
            if (melodyInterval) {
                clearInterval(melodyInterval);
                melodyInterval = null;
            }
        }

        function toggleSoundscape() {
            isSoundPlaying = !isSoundPlaying;
            const toggleBtn = document.getElementById('sound-toggle-btn');
            const soundLabel = document.getElementById('sound-label');
            if (isSoundPlaying) {
                playSoundscape();
                if(toggleBtn) toggleBtn.innerText = "關閉環境音";
                if(soundLabel) soundLabel.innerText = "🎵 療癒鋼琴與流光水聲";
            } else {
                stopSoundscape();
                if(toggleBtn) toggleBtn.innerText = "開啟環境音";
                if(soundLabel) soundLabel.innerText = "🎵 環境音已關閉";
            }
        }

        function toggleDimMode() {
            isDimMode = !isDimMode;
            const frame = document.getElementById('phone-frame');
            const btn = document.getElementById('dim-btn');
            if (isDimMode) {

        // 🌟 智慧評分匹配系統（支援 79 張圖卡精準命中）
        function matchImageAndCategory(taskText) {
            if (!taskText) return { filename: "read_books.jpg", category: "daily" };
            const text = taskText.toLowerCase();
            
            let bestMatch = null;
            let highestScore = 0;

            for (let item of imageDatabase) {
                if (item.keywords) {
                    let score = 0;
                    for (let word of item.keywords) {
                        if (text.includes(word.toLowerCase())) {
                            score += word.length;
                        }
                    }
                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = { filename: item.filename, category: item.category };
                    }
                }
            }

            if (bestMatch && highestScore > 0) {
                return bestMatch;
            }

            // 智慧 Fallback
            const fallbackPool = ["read_books.jpg", "3_o_clock.jpg", "fill_aroma_diffuser.jpg", "Clear_sky.jpg"];
            const randomFallback = fallbackPool[Math.floor(Math.random() * fallbackPool.length)];
            return { filename: randomFallback, category: "daily" };
        }

        function startBreathCycle() {
            if (breathInterval) clearInterval(breathInterval);
            const statusEl = document.getElementById('breath-instruction-text');
            const timerEl = document.getElementById('breath-timer-text');
            if (!statusEl) return;
            let timeLeft = 4;
            let phase = 1;
            const runTimer = () => {
                if (!document.getElementById('breath-instruction-text')) {
                    clearInterval(breathInterval);
                    return;
                }
                if (timeLeft > 0) {
                    if(timerEl) timerEl.innerText = timeLeft + " 秒";
                    timeLeft--;
                } else {
                    if (phase === 1) { phase = 2; timeLeft = 7; statusEl.innerText = "【 溫柔屏住氣息... 】"; }
                    else if (phase === 2) { phase = 3; timeLeft = 8; statusEl.innerText = "【 從口中細細吐氣... 】"; }
                    else { phase = 1; timeLeft = 4; statusEl.innerText = "【 鼻腔緩慢吸氣... 】"; }
                    if(timerEl) timerEl.innerText = timeLeft + " 秒";
                }
            };
            statusEl.innerText = "【 鼻腔緩慢吸氣... 】";
            if(timerEl) timerEl.innerText = "4 秒";
            breathInterval = setInterval(runTimer, 1000);
        }

                        html += `
                            <div onclick="openModal('images/${item.filename}', '夜色圖卡 #${index+1}')" class="${rareClass}" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(212,181,176,0.3); border-radius: 12px; padding: 6px; cursor: pointer; text-align: center; height: 85px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                                <img src="images/${item.filename}" style="width: 100%; height: 48px; object-fit: cover; border-radius: 6px; margin-bottom: 2px;" alt="圖卡">
                                <div style="display: flex; justify-content: space-between; width: 100%; padding: 0 2px;"><span style="font-size: 9px; color: #aaa;">#${index+1}</span>${rareBadge}</div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div style="background: rgba(255,255,255,0.01); border: 1px dashed rgba(255,255,255,0.08); border-radius: 12px; padding: 6px; text-align: center; height: 85px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                                <span style="font-size: 12px; opacity: 0.2; margin-bottom: 2px;">${item.isRare ? '✦' : '□'}</span>
                                <span style="font-size: 9px; color: ${item.isRare ? '#ffd700' : '#555'};">#${index+1} 待解鎖</span>
                            </div>
                        `;
                    }
                });
                html += '</div>';
                screen.innerHTML = html;
            } else if (screenName === 'morning') {
                let activeTasksHtml = "";
                let doneTasksHtml = "";
                const activeTasks = appState.taskList.filter(t => !t.done);
                const doneTasks = appState.taskList.filter(t => t.done);

                activeTasks.forEach((taskObj) => {
                    const realIndex = appState.taskList.indexOf(taskObj);
                    activeTasksHtml += `
                        <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); padding: 12px 14px; border-radius: 14px; margin-bottom: 8px; border: 1px solid rgba(212,181,176,0.15);">
                            <img src="images/${taskObj.img}" onclick="openModal('images/${taskObj.img}', '${taskObj.text}')" style="width: 40px; height: 40px; object-fit: cover; border-radius: 8px; flex-shrink: 0; cursor: pointer;" alt="圖卡">
                            <div style="flex: 1; text-align: left; display: flex; align-items: center;">
                                <input type="checkbox" onchange="toggleTask(${realIndex})" style="accent-color: #d4b5b0; margin-right: 12px; width: 18px; height: 18px; cursor: pointer;" title="勾選完成">
                                <span style="color: #eee; font-size: 14px;">${taskObj.text}</span>
                            </div>
                        </div>
                    `;
                });

                doneTasks.forEach((taskObj) => {
                    const realIndex = appState.taskList.indexOf(taskObj);
                    doneTasksHtml += `
                        <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.01); padding: 8px 12px; border-radius: 14px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.05); opacity: 0.6;">
                            <img src="images/${taskObj.img}" onclick="openModal('images/${taskObj.img}', '${taskObj.text}')" style="width: 32px; height: 32px; object-fit: cover; border-radius: 6px; flex-shrink: 0; cursor: pointer;" alt="圖卡">
                            <div style="flex: 1; text-align: left; display: flex; align-items: center;">
                                <input type="checkbox" checked onchange="toggleTask(${realIndex})" style="accent-color: #d4b5b0; margin-right: 10px; width: 16px; height: 16px; cursor: pointer;" title="改回進行中">
                                <span style="color: #888; font-size: 12px; text-decoration: line-through;">${taskObj.text}</span>
                            </div>
                        </div>
                    `;
                });

                if(activeTasks.length === 0) activeTasksHtml = '<p style="font-size: 13px; color: #777; text-align: center; padding: 15px 0;">昨天的待辦已經全數完成，今天一切安好 ✧</p>';

                screen.innerHTML = `
                    <div style="text-align: center;">
                        <p style="font-size: 11px; letter-spacing: 3px; color: #666; margin-bottom: 4px;">MORNING GLOW</p>
                        <h3 style="font-size: 20px; font-weight: 300; margin-bottom: 12px; color: #f2f2ef; font-family: Georgia, serif;">晨光報告</h3>
                        <div style="text-align: left; max-height: 280px; overflow-y: auto; padding-right: 4px;">
                            <p style="font-size: 12px; color: #d4b5b0; letter-spacing: 1px; margin-bottom: 8px;">進行中項目（勾選後才會歸檔）</p>
                            ${activeTasksHtml}
                            
                            ${doneTasks.length > 0 ? `
                                <p style="font-size: 12px; color: #777; letter-spacing: 1px; margin: 14px 0 6px 0;">已完成項目</p>
                                ${doneTasksHtml}
                            ` : ''}
                        </div>
                    </div>
                `;
            }
        }

        function finishIntro() { goTo('quote'); }
        
        function submitTextTask() {
            const inputBox = document.getElementById('user-task-input');
            const inputVal = inputBox ? inputBox.value.trim() : "";
            if(!inputVal) {
                alert("請先寫下今晚掛記的待辦事項 ✨");
                return;
            }

            const lines = inputVal.split('\n').filter(t => t.trim() !== "");
            const newTasks = lines.map(line => {
                const matchResult = matchImageAndCategory(line);
                if (!appState.unlockedImages.includes(matchResult.filename)) {
                    appState.unlockedImages.push(matchResult.filename);
                }
                return { text: line, img: matchResult.filename, done: false };
            });

            appState.taskList = [...appState.taskList, ...newTasks];
            appState.tempInputText = "";
            saveState();
            goTo('transition');
        }

        function toggleTask(index) {
            appState.taskList[index].done = !appState.taskList[index].done;
            const finishedTask = appState.taskList[index];
            if (finishedTask.done) {
                const randomPhrase = encouragementPhrases[Math.floor(Math.random() * encouragementPhrases.length)];
                openModal(`images/${finishedTask.img}`, `${randomPhrase}\n\n已完成：「${finishedTask.text}」`);
            }
            saveState();
            goTo('morning');
        }

        function openModal(imgSrc, captionText) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            const modalCaption = document.getElementById('modal-caption');
            if(!modal) return;
            if(modalImg) modalImg.src = imgSrc;
            if(modalCaption) modalCaption.innerText = captionText;
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            if(modal) modal.style.display = 'none';
        }

        document.getElementById('image-modal').addEventListener('click', (e) => {
            if(e.target.id === 'image-modal') closeModal();
        });

        goTo('intro');
    </script>
</body>
</html>
