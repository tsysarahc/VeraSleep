        let audioCtx = null;
        let noiseNode = null;
        let melodyInterval = null;
        let gainNode = null;
        let isSoundPlaying = true;
        let isDimMode = false;

        let breathTextInterval = null;

        function initAudio() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
        }

        function playSoundscape() {
            initAudio();
            stopSoundscape();
            if (!isSoundPlaying || !audioCtx) return;

            try {
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * 0.4;
                }

                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = noiseBuffer;
                noiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 320;
                filter.Q.value = 1.0;

                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);

                noiseNode.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                noiseNode.start();

                const pianoNotes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23];
                melodyInterval = setInterval(() => {
                    if (!isSoundPlaying || !audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    
                    const osc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    
                    const randomFreq = pianoNotes[Math.floor(Math.random() * pianoNotes.length)];
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(randomFreq, audioCtx.currentTime);

                    noteGain.gain.setValueAtTime(0, audioCtx.currentTime);
                    noteGain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 1.0);
                    noteGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);

                    osc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 5.0);
                }, 3800);
            } catch(e) {}
        }

        function stopSoundscape() {
            if (noiseNode) {
                try { noiseNode.stop(); noiseNode.disconnect(); } catch(e) {}
                noiseNode = null;
            }
            if (melodyInterval) {
                clearInterval(melodyInterval);
                melodyInterval = null;
            }
        }

        function toggleSoundscape() {
            isSoundPlaying = !isSoundPlaying;
            const toggleBtn = document.getElementById('sound-toggle-btn');
            const soundLabel = document.getElementById('sound-label');
            if (isSoundPlaying) {
                playSoundscape();
                if(toggleBtn) toggleBtn.innerText = "關閉環境音";
                if(soundLabel) soundLabel.innerText = "🎵 療癒鋼琴與流光水聲";
            } else {
                stopSoundscape();
                if(toggleBtn) toggleBtn.innerText = "開啟環境音";
                if(soundLabel) soundLabel.innerText = "🎵 環境音已關閉";
            }
        }

        function matchImageAndCategory(taskText) {
            if (!taskText) return { filename: "read_books.jpg", category: "daily" };
            const text = taskText.toLowerCase();
            for (let item of imageDatabase) {
                if (item.keywords) {
                    for (let word of item.keywords) {
                        if (text.includes(word)) {
                            return { filename: item.filename, category: item.category };
                        }
                    }
                }
            }
            for (let item of imageDatabase) {
                const cleanKey = item.filename.replace('.jpg', '').toLowerCase().replace(/[_]/g, ' ');
                if (text.includes(cleanKey) || cleanKey.split(' ').some(part => part.length > 2 && text.includes(part))) {
                    return { filename: item.filename, category: item.category };
                }
            }
            return { filename: "read_books.jpg", category: "daily" };
        }

            if (!statusEl) return;

            const runPhase = () => {
                if (!document.getElementById('breath-instruction-text')) return;
                statusEl.innerText = "【 鼻腔緩慢吸氣... 4s 】";
                setTimeout(() => {
                    if (document.getElementById('breath-instruction-text')) {
                        statusEl.innerText = "【 溫柔屏住氣息... 7s 】";
                    }
                }, 4000);
                setTimeout(() => {
                    if (document.getElementById('breath-instruction-text')) {
                        statusEl.innerText = "【 從口中細細吐氣... 8s 】";
                    }
                }, 11000);
            };

            runPhase();
            breathTextInterval = setInterval(runPhase, 19000);
        }

        function goTo(screenName) {
            const screen = document.getElementById('screen');
            const phoneBg = document.getElementById('phone-frame');
            const footer = document.getElementById('app-footer');
            if (!screen) return;
            screen.innerHTML = "";

            if (breathTextInterval) {
                clearInterval(breathTextInterval);
                breathTextInterval = null;
            }

            if (screenName === 'intro') {
                if(footer) footer.style.display = 'none';
                stopSoundscape();
            } else {
                if(footer) footer.style.display = 'flex';
                updateNav(screenName);
            }

            if (screenName === 'step1') {
                generateRandomQuickTasks();
            }

            if (screenName === 'step2') {
                if(phoneBg) phoneBg.style.backgroundColor = isDimMode ? "#050505" : "#080808";
                playSoundscape();
                setTimeout(startBreathCycle, 100);
            } else {
                if(phoneBg) phoneBg.style.backgroundColor = isDimMode ? "#050505" : "#161615";
                if(screenName !== 'step2') stopSoundscape();
            }

            if (screenName === 'intro') {
                let introContent = "";
                if (appState.introStep === 1) {
                    introContent = `
                        <div style="text-align: center;">
                            <p style="font-size: 10px; letter-spacing: 4px; color: #777; margin-bottom: 24px;">01 / 03</p>
                            <h2 style="font-size: 24px; font-weight: 300; line-height: 1.5; margin-bottom: 20px; color: #f2f2ef; font-family: Georgia, serif;">深夜的腦袋<br>裝滿未完的事</h2>
                            <p style="font-size: 13px; color: #888; line-height: 1.8; margin-bottom: 40px; font-weight: 300;">大腦為了怕遺忘而反覆運算，使人難以入眠。</p>
                            <button class="btn-primary" onclick="nextIntro()">繼續 ⟶</button>
                        </div>
                    `;
                } else if (appState.introStep === 2) {
                    introContent = `
                        <div style="text-align: center;">
                            <p style="font-size: 10px; letter-spacing: 4px; color: #777; margin-bottom: 24px;">02 / 03</p>
                            <h2 style="font-size: 24px; font-weight: 300; line-height: 1.5; margin-bottom: 20px; color: #f2f2ef; font-family: Georgia, serif;">思緒轉化為<br>專屬「夜色圖卡」</h2>
                            <p style="font-size: 13px; color: #888; line-height: 1.8; margin-bottom: 40px; font-weight: 300;">卸載後文字緩緩消失，並在集郵簿中解鎖精美夜色圖卡。</p>
                            <button class="btn-primary" onclick="nextIntro()">繼續 ⟶</button>
                        </div>
                    `;
                } else if (appState.introStep === 3) {
                    introContent = `
                        <div style="text-align: center;">
                            <p style="font-size: 10px; letter-spacing: 4px; color: #777; margin-bottom: 24px;">03 / 03</p>
                            <h2 style="font-size: 24px; font-weight: 300; line-height: 1.5; margin-bottom: 20px; color: #f2f2ef; font-family: Georgia, serif;">一夜好眠<br>從容迎接早晨</h2>
                            <p style="font-size: 13px; color: #888; line-height: 1.8; margin-bottom: 40px; font-weight: 300;">把世界交還給黑夜，早晨歸納已完成與進行中事項。</p>
                            <button class="btn-primary" onclick="finishIntro()">開啟寧靜之旅 ✧</button>
                        </div>
                    `;
                }
                screen.innerHTML = introContent;
            } else if (screenName === 'quote') {
                const currentQuote = sanctuaryQuotes[appState.currentQuoteIndex];
                screen.innerHTML = `
                    <div style="text-align: center;">
                        <p style="font-size: 10px; letter-spacing: 3px; color: #666; margin-bottom: 16px;">SANCTUARY REFLECTION</p>
                        <div class="card">
                            <p style="font-size: 16px; line-height: 1.9; color: #f2f2ef; font-family: Georgia, serif; font-weight: 300;">
                                “${currentQuote}”
                            </p>
                        </div>
                        <button class="btn-primary" onclick="goTo('step1')">開始今晚的思緒卸載</button>
                    </div>
                `;
            } else if (screenName === 'step1') {
                let quickButtonsHtml = '';
                currentRandomQuickTasks.forEach(task => {
                    quickButtonsHtml += `<button onclick="appendQuickTask('${task}')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #ccc; padding: 4px 8px; border-radius: 6px; font-size: 9px; cursor: pointer;">+ ${task}</button>`;
                });

                screen.innerHTML = `
                    <div>
                        <p style="font-size: 10px; letter-spacing: 3px; color: #666; margin-bottom: 4px; text-align: center;">COGNITIVE OFFLOADING</p>
                        <h3 style="font-size: 17px; font-weight: 300; margin-bottom: 8px; color: #f2f2ef; font-family: Georgia, serif; text-align: center;">寫下今晚掛記的事</h3>
                        <p style="font-size: 10px; color: #888; margin-bottom: 12px; text-align: center;">每行輸入一項，卸載重大待辦可解鎖稀有金卡</p>

                        <textarea id="user-task-input" class="text-input-box" placeholder="例如：&#10;處理信用卡帳單&#10;明天開會簡報">${appState.tempInputText}</textarea>
                        
                        <div style="margin-bottom: 12px;">
                            <p style="font-size: 9px; color: #777; margin-bottom: 4px; text-align: left;">隨機心事推薦（點擊快速帶入）：</p>
                            <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                                ${quickButtonsHtml}
                            </div>
                        </div>

                        <button class="btn-primary" style="margin-top:0;" onclick="submitTextTask()">將思緒轉化為夜色圖卡 ✧</button>
                    </div>
                `;
            } else if (screenName === 'step2') {
                screen.innerHTML = `
                    <div style="text-align: center;">
                        <div style="width: 84px; height: 84px; margin: 10px auto; background: rgba(255,255,255,0.02); border: 1px solid rgba(212,181,176,0.35); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px;" class="breathing-circle-sync">☾</div>
                        
                        <p id="breath-instruction-text" style="font-size: 13px; font-weight: 300; margin-bottom: 4px; color: #d4b5b0; font-family: Georgia, serif; letter-spacing: 1px;">【 準備開始 4-7-8 呼吸 】</p>
                        <p style="font-size: 10px; color: #888; margin-bottom: 14px;">讓視線與呼吸隨光暈緩慢收放，切斷交感神經</p>

                        <div style="background: rgba(255,255,255,0.02); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); font-size: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                            <span style="color: #aaa;" id="sound-label">${isSoundPlaying ? "🎵 療癒鋼琴與流光水聲" : "🎵 環境音已關閉"}</span>
                            <button id="sound-toggle-btn" onclick="toggleSoundscape()" style="background: rgba(212,181,176,0.15); border: none; color: #d4b5b0; padding: 4px 8px; border-radius: 6px; font-size: 9px; cursor: pointer;">${isSoundPlaying ? "關閉環境音" : "開啟環境音"}</button>
                        </div>

                        <div style="background: rgba(212,181,176,0.04); border: 1px solid rgba(212,181,176,0.15); border-radius: 12px; padding: 10px; margin-bottom: 12px; text-align: left;">
                            <p style="font-size: 9px; color: #d4b5b0; font-weight: 500; margin-bottom: 2px;">💡 睡眠醫學小貼士</p>
                            <p style="font-size: 9px; color: #aaa; line-height: 1.4;">若躺在床上 20 分鐘仍未入眠，請溫柔地離開床鋪，翻閱集郵簿或聽水聲。</p>
                        </div>

                        <button class="btn-primary" style="margin-top: 0; padding: 10px; background-color: transparent; color: #d4b5b0; border: 1px solid rgba(212,181,176,0.4);" onclick="goTo('morning')">結束冥想，進入早晨 ✧</button>
                    </div>
                `;
            } else if (screenName === 'vault') {
                const totalCount = imageDatabase.length;
                const unlockedCount = appState.unlockedImages.length;
                
                let html = `<h3 style="font-size: 18px; font-weight: 300; margin-bottom: 2px; color: #f2f2ef; font-family: Georgia, serif;">心靈集郵簿</h3>`;
                html += `<p style="font-size: 10px; color: #d4b5b0; margin-bottom: 10px; letter-spacing: 1px;">已收集 ${unlockedCount} / ${totalCount} 張夜色圖卡</p>`;
                
                const categories = [
                    { id: 'all', name: '全部' },
                    { id: 'daily', name: '日常' },
                    { id: 'work', name: '工作' },
                    { id: 'travel', name: '旅行' },
                    { id: 'misc', name: '雜項' }
                ];

                html += `<div style="display: flex; justify-content: center; gap: 6px; margin-bottom: 10px;">`;
                categories.forEach(cat => {
                    const isActive = currentVaultCategory === cat.id;
                    html += `<button onclick="setVaultCategory('${cat.id}')" style="background: ${isActive ? '#d4b5b0' : 'rgba(255,255,255,0.03)'}; color: ${isActive ? '#161615' : '#888'}; border: 1px solid rgba(212,181,176,0.2); padding: 4px 10px; border-radius: 8px; font-size: 9px; cursor: pointer; font-weight: ${isActive ? '600' : '400'};">${cat.name}</button>`;
                });
                html += `</div>`;

                html += '<div style="max-height: 280px; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-right: 4px;">';

                imageDatabase.forEach((item, index) => {
                    if (currentVaultCategory !== 'all' && item.category !== currentVaultCategory) return;

                    const isUnlocked = appState.unlockedImages.includes(item.filename);
                    const rareClass = item.isRare ? 'rare-card-glow' : '';
                    const rareBadge = item.isRare ? '<span style="font-size: 7px; color: #ffd700; font-weight: 600;">✦ 稀有金卡</span>' : '';

                    if (isUnlocked) {
                        html += `
                            <div onclick="openModal('images/${item.filename}', '夜色圖卡 #${index+1} ${item.isRare ? '【✨ 重大事項稀有金卡】' : ''}')" class="${rareClass}" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(212,181,176,0.3); border-radius: 12px; padding: 6px; cursor: pointer; text-align: center; height: 85px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;">
                                <img src="images/${item.filename}" style="width: 100%; height: 48px; object-fit: cover; border-radius: 6px; margin-bottom: 2px;" alt="夜色圖卡">
                                <div style="display: flex; justify-content: space-between; width: 100%; padding: 0 2px;">
                                    <span style="font-size: 8px; color: #aaa;">#${index+1 < 10 ? '0' + (index+1) : index+1}</span>
                                    ${rareBadge}
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div style="background: rgba(255,255,255,0.01); border: 1px dashed rgba(255,255,255,0.08); border-radius: 12px; padding: 6px; text-align: center; height: 85px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                                <span style="font-size: 14px; opacity: 0.2; margin-bottom: 2px;">${item.isRare ? '✦' : '□'}</span>
                                <span style="font-size: 9px; color: ${item.isRare ? '#ffd700' : '#555'};">#${index+1 < 10 ? '0' + (index+1) : index+1} 待解鎖</span>
                            </div>
                        `;
                    }
                });

                html += '</div>';
                screen.innerHTML = html;
            } else if (screenName === 'morning') {
                let activeTasksHtml = "";
                let doneTasksHtml = "";

                const activeTasks = appState.taskList.filter(t => !t.done);
                const doneTasks = appState.taskList.filter(t => t.done);

                if (activeTasks.length > 0) {
                    activeTasks.forEach((taskObj) => {
                        const realIndex = appState.taskList.indexOf(taskObj);
                        activeTasksHtml += `
                            <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); padding: 10px 12px; border-radius: 14px; margin-bottom: 8px; border: 1px solid rgba(212,181,176,0.15);">
                                <img src="images/${taskObj.img}" onclick="openModal('images/${taskObj.img}', '${taskObj.text}')" style="width: 38px; height: 38px; object-fit: cover; border-radius: 8px; flex-shrink: 0; cursor: pointer; border: 1px solid rgba(212,181,176,0.2);" title="點擊放大" alt="夜色圖卡">
                                <div style="flex: 1; text-align: left; display: flex; align-items: center;">
                                    <input type="checkbox" onchange="toggleTask(${realIndex})" style="accent-color: #d4b5b0; margin-right: 8px; width: 14px; height: 14px; cursor: pointer;">
                                    <span style="color: #ddd; font-size: 12px;">${taskObj.text}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    activeTasksHtml = '<p style="font-size: 11px; color: #666; text-align: center; padding: 10px 0;">目前沒有進行中的待辦事項。</p>';
                }

                if (doneTasks.length > 0) {
                    doneTasks.forEach((taskObj) => {
                        const realIndex = appState.taskList.indexOf(taskObj);
                        doneTasksHtml += `
                            <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.01); padding: 8px 12px; border-radius: 14px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.05); opacity: 0.6;">
                                <img src="images/${taskObj.img}" onclick="openModal('images/${taskObj.img}', '${taskObj.text}')" style="width: 32px; height: 32px; object-fit: cover; border-radius: 6px; flex-shrink: 0; cursor: pointer;" title="點擊放大" alt="夜色圖卡">
                                <div style="flex: 1; text-align: left; display: flex; align-items: center;">
                                    <input type="checkbox" checked onchange="toggleTask(${realIndex})" style="accent-color: #d4b5b0; margin-right: 8px; width: 14px; height: 14px; cursor: pointer;" title="改回進行中">
                                    <span style="color: #888; font-size: 11px; text-decoration: line-through;">${taskObj.text}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                screen.innerHTML = `
                    <div style="text-align: center;">
                        <p style="font-size: 10px; letter-spacing: 3px; color: #666; margin-bottom: 4px;">MORNING GLOW</p>
                        <h3 style="font-size: 18px; font-weight: 300; margin-bottom: 10px; color: #f2f2ef; font-family: Georgia, serif;">晨光報告</h3>
                        
                        <div style="text-align: left; max-height: 280px; overflow-y: auto; padding-right: 4px;">
                            <p style="font-size: 10px; color: #d4b5b0; letter-spacing: 1px; margin-bottom: 6px;">進行中項目</p>
                            ${activeTasksHtml}
                            
                            ${doneTasks.length > 0 ? `
                                <p style="font-size: 10px; color: #777; letter-spacing: 1px; margin: 12px 0 6px 0;">已完成項目（點擊取消勾選可改回）</p>
                                ${doneTasksHtml}
                            ` : ''}
                        </div>
                    </div>
                `;
            }
        }

        function nextIntro() { appState.introStep++; goTo('intro'); }
        function finishIntro() { goTo('quote'); }
        
        function submitTextTask() {
            const inputBox = document.getElementById('user-task-input');
            const inputVal = inputBox ? inputBox.value.trim() : "";
            if(!inputVal) {
                alert("請先寫下今晚掛記的事 ✨");
                return;
            }

            const lines = inputVal.split('\n').filter(t => t.trim() !== "");
            
            appState.taskList = lines.map(line => {
                const matchResult = matchImageAndCategory(line);
                const matchedFilename = matchResult.filename;

                if (!appState.unlockedImages.includes(matchedFilename)) {
                    appState.unlockedImages.push(matchedFilename);
                }
                return { text: line, img: matchedFilename, done: false };
            });

            appState.tempInputText = "";
            saveState();
            goTo('step2');
        }

        function toggleTask(index) {
            appState.taskList[index].done = !appState.taskList[index].done;
            const finishedTask = appState.taskList[index];
            
            if (finishedTask.done) {
                const randomPhrase = encouragementPhrases[Math.floor(Math.random() * encouragementPhrases.length)];
                openModal(`images/${finishedTask.img}`, `${randomPhrase}\n\n已完成：「${finishedTask.text}」`);
            }
            
            saveState();
            goTo('morning');
        }

        function openModal(imgSrc, captionText) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            const modalCaption = document.getElementById('modal-caption');
            if(!modal) return;
            
            if(modalImg) modalImg.src = imgSrc;
            if(modalCaption) modalCaption.innerText = captionText;
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            if(modal) modal.style.display = 'none';
        }

        const modalEl = document.getElementById('image-modal');
        if(modalEl) modalEl.addEventListener('click', closeModal);

        goTo('intro');
    </script>
</body>
</html>
