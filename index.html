<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VERA">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>VERA - Nightly Sanctuary</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0e0e0e;
            color: #f2f2ef;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-frame {
            width: 100%;
            max-width: 390px;
            height: 800px;
            background-color: #161615;
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            transition: background-color 0.5s ease;
            font-size: 13px;
        }
        .phone-frame.dim-mode {
            background-color: #050505 !important;
        }
        .phone-frame.dim-mode .card,
        .phone-frame.dim-mode div[style*="background"] {
            background-color: rgba(255, 255, 255, 0.01) !important;
            border-color: rgba(255, 255, 255, 0.04) !important;
        }
        .phone-frame.dim-mode p,
        .phone-frame.dim-mode h3 {
            opacity: 0.75;
        }

        .header {
            padding: 24px 24px 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
            letter-spacing: 2px;
        }
        .footer {
            padding: 16px 24px 24px 24px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: linear-gradient(to top, #161615 60%, rgba(22,22,21,0));
            z-index: 10;
        }
        .footer button {
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .footer button.active, .footer button:hover { color: #d4b5b0; }
        .footer button span.icon { font-size: 16px; margin-bottom: 4px; }
        
        .content {
            flex: 1;
            padding: 12px 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.03);
            padding: 24px;
            border-radius: 24px;
            border: 1px solid rgba(212, 181, 176, 0.2);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            position: relative;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #d4b5b0;
            color: #161615;
            border: none;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.95; transform: scale(0.99); }
        
        .text-input-box {
            width: 100%;
            height: 120px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 181, 176, 0.2);
            border-radius: 16px;
            padding: 14px;
            color: #f2f2ef;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .text-input-box:focus { border-color: rgba(212, 181, 176, 0.5); }

        #image-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px);
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        #image-modal img {
            max-width: 85%;
            max-height: 320px;
            border-radius: 16px;
            border: 1px solid rgba(212, 181, 176, 0.4);
            margin-bottom: 16px;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* 城市選擇 Modal */
        #city-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            z-index: 99998;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .rare-card-glow {
            border: 1px solid rgba(255, 215, 0, 0.7) !important;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
            background: linear-gradient(135deg, rgba(255,215,0,0.06) 0%, rgba(255,255,255,0.02) 100%);
        }

        @keyframes softBreathing {
            0%, 100% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 15px rgba(212,181,176,0.1); }
            50% { transform: scale(1.18); opacity: 1; box-shadow: 0 0 35px rgba(212,181,176,0.25); }
        }
        .breathing-circle-sync { animation: softBreathing 8s infinite ease-in-out; }
    </style>
</head>
<body>

    <div class="phone-frame" id="phone-frame">
        <div class="header">
            <span style="font-size: 12px; color: #aaa;">23:45</span>
            <span style="color: #d4b5b0; font-weight: 500; letter-spacing: 3px; font-size: 13px;">VERA</span>
            <div>
                <button onclick="toggleDimMode()" id="dim-btn" style="background:none; border: 1px solid rgba(212,181,176,0.3); color: #d4b5b0; padding: 3px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; margin-right: 4px;">護眼暗黑</button>
                <button onclick="openCityModal()" id="weather-btn" style="background:rgba(212,181,176,0.1); border: 1px solid rgba(212,181,176,0.3); color: #d4b5b0; padding: 3px 8px; border-radius: 6px; font-size: 10px; cursor: pointer;" title="選擇城市">📍 載入中...</button>
            </div>
        </div>

        <div id="screen" class="content"></div>

        <!-- 圖片放大檢視 Modal -->
        <div id="image-modal">
            <img id="modal-img" src="" alt="Zoomed">
            <p id="modal-caption" style="font-size: 14px; color: #f2f2ef; letter-spacing: 1px; margin-bottom: 16px; line-height: 1.7; white-space: pre-wrap; font-family: Georgia, serif;"></p>
            <span style="font-size: 11px; color: #888; letter-spacing: 1px;">（點擊任意處關閉）</span>
        </div>

        <!-- 城市選擇 Modal -->
        <div id="city-modal">
            <div style="background: #1a1a19; border: 1px solid rgba(212,181,176,0.3); border-radius: 24px; padding: 22px; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8);">
                <h3 style="font-size: 16px; font-weight: 300; color: #f2f2ef; margin-bottom: 6px; font-family: Georgia, serif;">選擇您的城市</h3>
                <p style="font-size: 10px; color: #888; margin-bottom: 14px;">點擊以更新當地氣溫</p>
                
                <div id="city-list-container" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 240px; overflow-y: auto; margin-bottom: 14px; padding-right: 2px;"></div>

                <button onclick="closeCityModal()" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #aaa; border-radius: 12px; font-size: 12px; cursor: pointer;">取消</button>
            </div>
        </div>

        <div class="footer" id="app-footer" style="display: none;">
            <button id="nav-quote" onclick="goTo('quote')"><span class="icon">✧</span>療癒心棧</button>
            <button id="nav-step1" onclick="goTo('step1')"><span class="icon">✎</span>卸載</button>
            <button id="nav-step2" onclick="goTo('step2')"><span class="icon">☾</span>助眠</button>
            <button id="nav-vault" onclick="goTo('vault')"><span class="icon">□</span>集郵簿</button>
            <button id="nav-morning" onclick="goTo('morning')"><span class="icon">☼</span>晨光</button>
        </div>
    </div>

    <!-- 用於動態生成金句分享圖的隱藏 Canvas -->
    <canvas id="share-canvas" width="600" height="600" style="display:none;"></canvas>

    <script>
        let audioCtx = null;
        let noiseNode = null;
        let melodyInterval = null;
        let gainNode = null;
        let isSoundPlaying = true;
        let isDimMode = false;
        let currentVaultCategory = 'all'; 
        let breathInterval = null;
        let showBreathTimer = true;

        const cities = {
            hk: { name: "香港", lat: 22.3193, lon: 114.1694 },
            taipei: { name: "台北", lat: 25.0330, lon: 121.5654 },
            tokyo: { name: "東京", lat: 35.6762, lon: 139.6503 },
            london: { name: "倫敦", lat: 51.5074, lon: -0.1278 },
            newyork: { name: "紐約", lat: 40.7128, lon: -74.0060 },
            losangeles: { name: "洛杉磯", lat: 34.0522, lon: -118.2437 },
            sanfrancisco: { name: "舊金山", lat: 37.7749, lon: -122.4194 },
            chicago: { name: "芝加哥", lat: 41.8781, lon: -87.6298 },
            seattle: { name: "西雅圖", lat: 47.6062, lon: -122.3321 }
        };

        let localWeather = {
            cityName: localStorage.getItem('vera_city') || "香港",
            temp: "--"
        };

        function initWeather() {
            const savedCityKey = localStorage.getItem('vera_city_key') || 'hk';
            const city = cities[savedCityKey] || cities.hk;
            getWeatherByCoords(savedCityKey, city.lat, city.lon, city.name);
            buildCityModalList();
        }

        async function getWeatherByCoords(cityKey, lat, lon, cityName) {
            try {
                localWeather.cityName = cityName;
                localStorage.setItem('vera_city', cityName);
                localStorage.setItem('vera_city_key', cityKey);
                
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`);
                const data = await response.json();
                
                if(data && data.current) {
                    const temp = Math.round(data.current.temperature_2m);
                    localWeather.temp = temp + "°C";
                }
            } catch(e) {
                localWeather.temp = "--";
            }

            const btn = document.getElementById('weather-btn');
            if(btn) btn.innerText = `📍 ${localWeather.cityName} ${localWeather.temp}`;
        }

        function buildCityModalList() {
            const container = document.getElementById('city-list-container');
            if(!container) return;
            container.innerHTML = "";

            for (let key in cities) {
                const c = cities[key];
                const isSelected = localStorage.getItem('vera_city_key') === key;
                const btn = document.createElement('button');
                btn.innerHTML = c.name;
                btn.style.cssText = `
                    padding: 10px;
                    background: ${isSelected ? 'rgba(212,181,176,0.2)' : 'rgba(255,255,255,0.03)'};
                    border: 1px solid ${isSelected ? 'rgba(212,181,176,0.5)' : 'rgba(212,181,176,0.15)'};
                    color: ${isSelected ? '#f2f2ef' : '#bbb'};
                    border-radius: 12px;
                    font-size: 12px;
                    cursor: pointer;
                    transition: all 0.2s;
                `;
                btn.onclick = () => {
                    getWeatherByCoords(key, c.lat, c.lon, c.name);
                    closeCityModal();
                };
                container.appendChild(btn);
            }
        }

        function openCityModal() {
            buildCityModalList();
            document.getElementById('city-modal').style.display = 'flex';
        }

        function closeCityModal() {
            document.getElementById('city-modal').style.display = 'none';
        }

        initWeather();

        function initAudio() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) {}
        }

        function playSoundscape() {
            initAudio();
            stopSoundscape();
            if (!isSoundPlaying || !audioCtx) return;

            try {
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * 0.4;
                }

                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = noiseBuffer;
                noiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 320;
                filter.Q.value = 1.0;

                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);

                noiseNode.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                noiseNode.start();

                const pianoNotes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23];
                melodyInterval = setInterval(() => {
                    if (!isSoundPlaying || !audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    
                    const osc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    
                    const randomFreq = pianoNotes[Math.floor(Math.random() * pianoNotes.length)];
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(randomFreq, audioCtx.currentTime);

                    noteGain.gain.setValueAtTime(0, audioCtx.currentTime);
                    noteGain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 1.0);
                    noteGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);

                    osc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 5.0);
                }, 3800);
            } catch(e) {}
        }

        function stopSoundscape() {
            if (noiseNode) {
                try { noiseNode.stop(); noiseNode.disconnect(); } catch(e) {}
                noiseNode = null;
            }
            if (melodyInterval) {
                clearInterval(melodyInterval);
                melodyInterval = null;
            }
        }

        function toggleSoundscape() {
            isSoundPlaying = !isSoundPlaying;
            const toggleBtn = document.getElementById('sound-toggle-btn');
            const soundLabel = document.getElementById('sound-label');
            if (isSoundPlaying) {
                playSoundscape();
                if(toggleBtn) toggleBtn.innerText = "關閉環境音";
                if(soundLabel) soundLabel.innerText = "🎵 療癒鋼琴與流光水聲";
            } else {
                stopSoundscape();
                if(toggleBtn) toggleBtn.innerText = "開啟環境音";
                if(soundLabel) soundLabel.innerText = "🎵 環境音已關閉";
            }
        }

        function toggleDimMode() {
            isDimMode = !isDimMode;
            const frame = document.getElementById('phone-frame');
            const btn = document.getElementById('dim-btn');
            if (isDimMode) {
                frame.classList.add('dim-mode');
                btn.innerText = "標準模式";
            } else {
                frame.classList.remove('dim-mode');
                btn.innerText = "護眼暗黑";
            }
        }

        const sanctuaryQuotes = [

            "把肩膀的緊繃鬆開一點，世界不會因為你今晚停下而崩塌。",

            "你已經做得夠好了，不需要在深夜向誰證明甚麼。",
            "睡不著也沒關係，就當作是多出來的安靜屬於你自己的時間。",
            "把心裡的燈光調暗一點，黑夜會溫柔地接住你所有的疲憊。",
            "放過那個對自己要求太完美的自己吧，今晚允許不完美。",
            "每一個失眠的夜晚，都是靈魂在喧囂世界裡給你的獨處溫柔。",
            "把重擔卸下吧，明天太陽升起時，你會有新的力量。",
            "不必急著找答案，有些問題在睡一覺後自然會有出路。",
            "你心裡那些過不去的坎，在漫長的宇宙裡其實都很輕盈。",
            "給自己一個擁抱，今天辛苦了，真的辛苦了。",

            "把不屬於今晚的思緒，通通放進記憶的抽屜裡鎖上。",

        function matchImageAndCategory(taskText) {

            const text = taskText.toLowerCase();
            for (let item of imageDatabase) {
                if (item.keywords) {
                    for (let word of item.keywords) {
                        if (text.includes(word)) {
                            return { filename: item.filename, category: item.category };
                        }
                    }
                }
            }
            return { filename: "read_books.jpg", category: "daily" };
        }

        function downloadQuoteCard(quoteText) {
            const canvas = document.getElementById('share-canvas');
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#161615';
            ctx.fillRect(0, 0, 600, 600);

            ctx.strokeStyle = 'rgba(212, 181, 176, 0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 30, 540, 540);

            ctx.fillStyle = '#d4b5b0';
            ctx.font = '14px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('NIGHTLY SANCTUARY • VERA', 300, 80);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(150, 110);
            ctx.lineTo(450, 110);
            ctx.stroke();

            ctx.fillStyle = '#f2f2ef';
            ctx.font = '22px Georgia, serif';
            ctx.textAlign = 'center';
            
            const words = quoteText.split('');
            let line = '';
            let lines = [];
            for(let i = 0; i < words.length; i++) {
                let testLine = line + words[i];
                let metrics = ctx.measureText(testLine);
                if (metrics.width > 420 && i > 0) {
                    lines.push(line);
                    line = words[i];
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            let startY = 250 - (lines.length * 20);
            lines.forEach((l, index) => {
                ctx.fillText(`“ ${l} ”`, 300, startY + (index * 42));
            });

            ctx.fillStyle = '#777';
            ctx.font = '12px -apple-system, sans-serif';
            ctx.fillText('今夜由 VERA 陪你安穩入眠', 300, 510);

            const link = document.createElement('a');
            link.download = 'VERA-Sanctuary-Card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

                }
            };

            statusEl.innerText = "【 鼻腔緩慢吸氣... 】";
            if(timerEl) timerEl.innerText = "4 秒";
            breathInterval = setInterval(runTimer, 1000);
        }

        function goTo(screenName) {
            const screen = document.getElementById('screen');
            const phoneBg = document.getElementById('phone-frame');
            const footer = document.getElementById('app-footer');
            if (!screen) return;
            screen.innerHTML = "";

            if (breathInterval) {
                clearInterval(breathInterval);
                breathInterval = null;
            }

            if (screenName === 'intro') {
                if(footer) footer.style.display = 'none';
                stopSoundscape();
            } else {
                if(footer) footer.style.display = 'flex';
                updateNav(screenName);
            }

            if (screenName === 'step1') generateRandomQuickTasks();

            if (screenName === 'step2') {
                if(phoneBg) phoneBg.style.backgroundColor = isDimMode ? "#050505" : "#080808";
                playSoundscape();
                setTimeout(startBreathCycle, 100);
            } else {
                if(phoneBg) phoneBg.style.backgroundColor = isDimMode ? "#050505" : "#161615";
                if(screenName !== 'step2') stopSoundscape();
            }

            if (screenName === 'intro') {
                screen.innerHTML = `
                    <div id="intro-screen-container" style="text-align: center; display: flex; flex-direction: column; height: 100%; justify-content: space-around; padding: 10px 0;">
                        <div>
                            <span style="font-size: 11px; letter-spacing: 4px; color: #888;">NIGHTLY SANCTUARY</span>
                        </div>

                        <div style="width: 100%; height: 340px; border-radius: 24px; overflow: hidden; border: 1px solid rgba(212,181,176,0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.7); cursor: pointer;" onclick="openModal('images/Clear_sky.jpg', 'VERA 夜色 sanctuary')">
                            <img src="images/Clear_sky.jpg" style="width: 100%; height: 100%; object-fit: cover;" alt="夜色圖卡">
                        </div>

                        <div>
                            <button class="btn-primary" onclick="finishIntro()">開啟寧靜之旅 ✧</button>
                        </div>
                    </div>
                `;
            } else if (screenName === 'quote') {
                const currentQuote = sanctuaryQuotes[appState.currentQuoteIndex];
                const isSaved = appState.savedQuotes.includes(currentQuote);
                
                screen.innerHTML = `
                    <div style="text-align: center;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <p style="font-size: 10px; letter-spacing: 3px; color: #666;">SANCTUARY REFLECTION</p>
                            <div>
                                <button onclick="toggleSaveQuote('${currentQuote}')" style="background:none; border:none; color: ${isSaved ? '#ffd700' : '#888'}; font-size: 14px; cursor: pointer; margin-right: 8px;" title="收藏金句">
                                    ${isSaved ? '★ 已收藏' : '☆ 收藏'}
                                </button>
                                <button onclick="downloadQuoteCard('${currentQuote}')" style="background:rgba(212,181,176,0.1); border: 1px solid rgba(212,181,176,0.3); color: #d4b5b0; padding: 2px 6px; border-radius: 6px; font-size: 10px; cursor: pointer;" title="下載卡片">
                                    💾 下載卡片
                                </button>
                            </div>
                        </div>

                        <div class="card">
                            <p style="font-size: 17px; line-height: 1.9; color: #f2f2ef; font-family: Georgia, serif; font-weight: 300;">
                                “${currentQuote}”
                            </p>
                        </div>
                        <button class="btn-primary" onclick="goTo('step1')">開始今晚的待辦卸載</button>
                    </div>
                `;
            } else if (screenName === 'step1') {
                let quickButtonsHtml = '';
                currentRandomQuickTasks.forEach(task => {
                    quickButtonsHtml += `<button onclick="appendQuickTask('${task}')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #ccc; padding: 5px 9px; border-radius: 6px; font-size: 10px; cursor: pointer;">+ ${task}</button>`;
                });

                screen.innerHTML = `
                    <div>
                        <p style="font-size: 10px; letter-spacing: 3px; color: #666; margin-bottom: 2px; text-align: center;">COGNITIVE OFFLOADING</p>
                        <h3 style="font-size: 17px; font-weight: 300; margin-bottom: 6px; color: #f2f2ef; font-family: Georgia, serif; text-align: center;">寫下今晚掛記的待辦事項</h3>
                        <p style="font-size: 10px; color: #888; margin-bottom: 12px; text-align: center;">每行輸入一項，卸載重大待辦可解鎖稀有金卡</p>

                        <textarea id="user-task-input" class="text-input-box" placeholder="例如：&#10;處理信用卡帳單&#10;明天開會簡報">${appState.tempInputText}</textarea>
                        
                        <div style="margin-bottom: 12px;">
                            <p style="font-size: 10px; color: #777; margin-bottom: 4px;">常用待辦推薦：</p>
                            <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                                ${quickButtonsHtml}
                            </div>
                        </div>

                        <button class="btn-primary" style="margin-top:0;" onclick="submitTextTask()">將待辦轉化為夜色圖卡 ✧</button>
                    </div>
                `;
            } else if (screenName === 'step2') {
                screen.innerHTML = `
                    <div style="text-align: center;">
                        <div style="width: 84px; height: 84px; margin: 10px auto; background: rgba(255,255,255,0.02); border: 1px solid rgba(212,181,176,0.35); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;" class="breathing-circle-sync">
                            ${showBreathTimer ? `<span id="breath-timer-text" style="font-size: 15px; color: #d4b5b0; font-weight: 600; font-family: Georgia, serif;">4s</span>` : `<span style="font-size: 18px; color: #d4b5b0;">✦</span>`}
                        </div>
                        
                        <p id="breath-instruction-text" style="font-size: 14px; font-weight: 300; margin-bottom: 4px; color: #d4b5b0; font-family: Georgia, serif; letter-spacing: 1px;">【 鼻腔緩慢吸氣... 】</p>
                        
                        <div style="margin-bottom: 12px;">
                            <button onclick="toggleBreathTimer()" style="background: none; border: 1px dashed rgba(212,181,176,0.4); color: #aaa; font-size: 9px; padding: 3px 8px; border-radius: 6px; cursor: pointer;">
                                ${showBreathTimer ? "切換為「無數字純光暈」模式" : "切換為「顯示秒數倒數」模式"}
                            </button>
                        </div>

                        <div style="background: rgba(255,255,255,0.02); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); font-size: 11px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                            <span style="color: #aaa;" id="sound-label">${isSoundPlaying ? "🎵 療癒鋼琴與流光水聲" : "🎵 環境音已關閉"}</span>
                            <button id="sound-toggle-btn" onclick="toggleSoundscape()" style="background: rgba(212,181,176,0.15); border: none; color: #d4b5b0; padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer;">${isSoundPlaying ? "關閉環境音" : "開啟環境音"}</button>
                        </div>

                        <button class="btn-primary" style="margin-top: 0; padding: 10px; background-color: transparent; color: #d4b5b0; border: 1px solid rgba(212,181,176,0.4);" onclick="goTo('morning')">結束冥想，進入早晨 ✧</button>
                    </div>
                `;
            } else if (screenName === 'vault') {
                const totalCount = imageDatabase.length;
                const unlockedCount = appState.unlockedImages.length;
                const savedQuotesCount = appState.savedQuotes.length;
                
                let html = `<h3 style="font-size: 18px; font-weight: 300; margin-bottom: 2px; color: #f2f2ef; font-family: Georgia, serif;">心靈集郵簿</h3>`;
                html += `<p style="font-size: 11px; color: #d4b5b0; margin-bottom: 10px; letter-spacing: 1px;">圖卡 ${unlockedCount} / ${totalCount} 張 | 收藏金句 ${savedQuotesCount} 句</p>`;
                
                const categories = [
                    { id: 'all', name: '全部圖卡' },
                    { id: 'weather', name: '天氣' },
                    { id: 'daily', name: '日常' },
                    { id: 'work', name: '工作' },
                    { id: 'quotes', name: '★ 收藏金句' }
                ];

                html += `<div style="display: flex; justify-content: center; gap: 4px; margin-bottom: 10px; flex-wrap: wrap;">`;
                categories.forEach(cat => {
                    const isActive = currentVaultCategory === cat.id;
                    html += `<button onclick="setVaultCategory('${cat.id}')" style="background: ${isActive ? '#d4b5b0' : 'rgba(255,255,255,0.03)'}; color: ${isActive ? '#161615' : '#888'}; border: 1px solid rgba(212,181,176,0.2); padding: 4px 8px; border-radius: 8px; font-size: 9px; cursor: pointer; font-weight: ${isActive ? '600' : '400'};">${cat.name}</button>`;
                });
                html += `</div>`;

                if (currentVaultCategory === 'quotes') {
                    html += '<div style="max-height: 250px; overflow-y: auto; text-align: left; display: flex; flex-direction: column; gap: 6px; padding-right: 4px;">';
                    if (appState.savedQuotes.length > 0) {
                        appState.savedQuotes.forEach((q) => {
                            html += `
                                <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(212,181,176,0.2); border-radius: 12px; padding: 10px; display: flex; justify-content: space-between; align-items: center;">
                                    <p style="font-size: 12px; color: #f2f2ef; font-family: Georgia, serif; flex: 1; padding-right: 8px;">“${q}”</p>
                                    <button onclick="downloadQuoteCard('${q}')" style="background: rgba(212,181,176,0.1); border: 1px solid rgba(212,181,176,0.3); color: #d4b5b0; padding: 4px 8px; border-radius: 6px; font-size: 9px; cursor: pointer; flex-shrink: 0;">下載</button>
                                </div>
                            `;
                        });
                    } else {
                        html += '<p style="font-size: 11px; color: #777; text-align: center; padding: 30px 0;">尚未收藏任何金句，點擊「療癒心棧」的星星來收藏吧 ✧</p>';
                    }
                    html += '</div>';
                } else {
                    html += '<div style="max-height: 250px; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-right: 4px;">';

                    imageDatabase.forEach((item, index) => {
                        if (currentVaultCategory !== 'all' && item.category !== currentVaultCategory) return;

                        const isUnlocked = appState.unlockedImages.includes(item.filename);
                        const rareClass = item.isRare ? 'rare-card-glow' : '';
                        const rareBadge = item.isRare ? '<span style="font-size: 8px; color: #ffd700; font-weight: 600;">✦ 稀有</span>' : '';

                        if (isUnlocked) {
                            html += `
                                <div onclick="openModal('images/${item.filename}', '夜色圖卡 #${index+1} ${item.isRare ? '【✨ 重大事項稀有金卡】' : ''}')" class="${rareClass}" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(212,181,176,0.3); border-radius: 12px; padding: 6px; cursor: pointer; text-align: center; height: 85px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;">
                                    <img src="images/${item.filename}" style="width: 100%; height: 48px; object-fit: cover; border-radius: 6px; margin-bottom: 2px;" alt="夜色圖卡">
                                    <div style="display: flex; justify-content: space-between; width: 100%; padding: 0 2px;">
                                        <span style="font-size: 9px; color: #aaa;">#${index+1}</span>
                                        ${rareBadge}
                                    </div>
                                </div>
                            `;
                        } else {
                            html += `
                                <div style="background: rgba(255,255,255,0.01); border: 1px dashed rgba(255,255,255,0.08); border-radius: 12px; padding: 6px; text-align: center; height: 85px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                                    <span style="font-size: 14px; opacity: 0.2; margin-bottom: 2px;">${item.isRare ? '✦' : '□'}</span>
                                    <span style="font-size: 10px; color: ${item.isRare ? '#ffd700' : '#555'};">#${index+1} 待解鎖</span>
                                </div>
                            `;
                        }
                    });
                    html += '</div>';
                }

                screen.innerHTML = html;
            } else if (screenName === 'morning') {
                let activeTasksHtml = "";
                let doneTasksHtml = "";

                const activeTasks = appState.taskList.filter(t => !t.done);
                const doneTasks = appState.taskList.filter(t => t.done);

                if (activeTasks.length > 0) {
                    activeTasks.forEach((taskObj) => {
                        const realIndex = appState.taskList.indexOf(taskObj);
                        activeTasksHtml += `
                            <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); padding: 10px 12px; border-radius: 14px; margin-bottom: 8px; border: 1px solid rgba(212,181,176,0.15);">
                                <img src="images/${taskObj.img}" onclick="openModal('images/${taskObj.img}', '${taskObj.text}')" style="width: 38px; height: 38px; object-fit: cover; border-radius: 8px; flex-shrink: 0; cursor: pointer; border: 1px solid rgba(212,181,176,0.2);" title="點擊放大" alt="夜色圖卡">
                                <div style="flex: 1; text-align: left; display: flex; align-items: center;">
                                    <input type="checkbox" onchange="toggleTask(${realIndex})" style="accent-color: #d4b5b0; margin-right: 10px; width: 16px; height: 16px; cursor: pointer;">
                                    <span style="color: #eee; font-size: 13px;">${taskObj.text}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    activeTasksHtml = '<p style="font-size: 12px; color: #777; text-align: center; padding: 15px 0;">昨天的待辦已經好好封存，今天挑件輕鬆的做，或者甚麼都不做也很好。</p>';
                }

                if (doneTasks.length > 0) {
                    doneTasks.forEach((taskObj) => {
                        const realIndex = appState.taskList.indexOf(taskObj);
                        doneTasksHtml += `
                            <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.01); padding: 8px 12px; border-radius: 14px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.05); opacity: 0.6;">
                                <img src="images/${taskObj.img}" onclick="openModal('images/${taskObj.img}', '${taskObj.text}')" style="width: 32px; height: 32px; object-fit: cover; border-radius: 6px; flex-shrink: 0; cursor: pointer;" title="點擊放大" alt="夜色圖卡">
                                <div style="flex: 1; text-align: left; display: flex; align-items: center;">
                                    <input type="checkbox" checked onchange="toggleTask(${realIndex})" style="accent-color: #d4b5b0; margin-right: 10px; width: 16px; height: 16px; cursor: pointer;" title="改回進行中">
                                    <span style="color: #888; font-size: 12px; text-decoration: line-through;">${taskObj.text}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                screen.innerHTML = `
                    <div style="text-align: center;">
                        <p style="font-size: 10px; letter-spacing: 3px; color: #666; margin-bottom: 4px;">MORNING GLOW</p>
                        <h3 style="font-size: 18px; font-weight: 300; margin-bottom: 10px; color: #f2f2ef; font-family: Georgia, serif;">晨光報告</h3>
                        
                        <div style="text-align: left; max-height: 280px; overflow-y: auto; padding-right: 4px;">
                            <p style="font-size: 11px; color: #d4b5b0; letter-spacing: 1px; margin-bottom: 6px;">進行中項目</p>
                            ${activeTasksHtml}
                            
                            ${doneTasks.length > 0 ? `
                                <p style="font-size: 11px; color: #777; letter-spacing: 1px; margin: 12px 0 6px 0;">已完成項目（點擊取消勾選可改回）</p>
                                ${doneTasksHtml}
                            ` : ''}
                        </div>
                    </div>
                `;
            }
        }

        function finishIntro() { goTo('quote'); }
        
        function submitTextTask() {
            const inputBox = document.getElementById('user-task-input');
            const inputVal = inputBox ? inputBox.value.trim() : "";
            if(!inputVal) {
                alert("請先寫下今晚掛記的待辦事項 ✨");
                return;
            }

            const lines = inputVal.split('\n').filter(t => t.trim() !== "");
            appState.taskList = lines.map(line => {
                const matchResult = matchImageAndCategory(line);
                if (!appState.unlockedImages.includes(matchResult.filename)) {
                    appState.unlockedImages.push(matchResult.filename);
                }
                return { text: line, img: matchResult.filename, done: false };
            });

            appState.tempInputText = "";
            saveState();
            goTo('step2');
        }

        function toggleTask(index) {
            appState.taskList[index].done = !appState.taskList[index].done;
            const finishedTask = appState.taskList[index];
            
            if (finishedTask.done) {
                const randomPhrase = encouragementPhrases[Math.floor(Math.random() * encouragementPhrases.length)];
                openModal(`images/${finishedTask.img}`, `${randomPhrase}\n\n已完成：「${finishedTask.text}」`);
            }
            
            saveState();
            goTo('morning');
        }

        function openModal(imgSrc, captionText) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            const modalCaption = document.getElementById('modal-caption');
            if(!modal) return;
            if(modalImg) modalImg.src = imgSrc;
            if(modalCaption) modalCaption.innerText = captionText;
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            if(modal) modal.style.display = 'none';
        }

        document.getElementById('image-modal').addEventListener('click', (e) => {
            if(e.target.id === 'image-modal') closeModal();
        });

        goTo('intro');
    </script>
</body>
</html>
